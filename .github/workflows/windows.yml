name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows / x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Smoke test native Windows paths
        shell: pwsh
        run: |
          $pcHome = Join-Path $env:RUNNER_TEMP "pc-home"
          $pcWorkspace = Join-Path $env:RUNNER_TEMP "pc-workspace"
          New-Item -ItemType Directory -Force $pcHome, $pcWorkspace | Out-Null

          @"
          workspace: "$pcWorkspace"
          security:
            mode: full
            network: true
            protect_secrets: true
          "@ | Set-Content -Encoding utf8NoBOM (Join-Path $pcHome "config.yaml")

          $env:PC_HOME = $pcHome
          $env:PC_LISTEN = "127.0.0.1:0"
          $stdout = Join-Path $env:RUNNER_TEMP "pc-smoke.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "pc-smoke.stderr.log"
          $process = Start-Process -FilePath ".\target\release\pc.exe" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 2
          if ($process.HasExited) {
            Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
            throw "pc.exe exited during Windows smoke test with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force

          if (-not (Test-Path (Join-Path $pcHome "pc.db"))) {
            throw "pc.db was not created through a native Windows filesystem path"
          }
          $config = Get-Content (Join-Path $pcHome "config.yaml") -Raw
          if ($config -notmatch "oauth_password:\s+\S+") {
            throw "oauth_password was not generated internally"
          }

      - name: Upload pc.exe
        uses: actions/upload-artifact@v4
        with:
          name: pc-windows-x86_64
          path: target/release/pc.exe
          if-no-files-found: error
